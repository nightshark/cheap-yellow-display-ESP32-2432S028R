# This is a fixed version based on the compilation errors provided
# The original file had several type conversion and API usage errors

substitutions:
  device_name: "cheap-yellow-display-a"
  friendly_name: "CYD Display A"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    then:
      - lambda: |-
          // Initialize WiFi component reference
          auto wifi_component = id(wifi_component);

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Web server
web_server:
  port: 80

# Time component
time:
  - platform: homeassistant
    id: homeassistant_time

# SPI Configuration
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Display with LVGL
display:
  - platform: ili9xxx
    model: ili9342
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    invert_colors: true
    id: my_display
    lambda: |-
      // Example of properly using ESPTime with strftime
      auto time = id(homeassistant_time).now();
      if (time.is_valid()) {
        char buf[20];
        // FIXED: Use to_c_tm() to convert ESPTime to tm struct
        strftime(buf, sizeof(buf), "%Y-%m-%d %H:%M", &time.to_c_tm());
        it.print(160, 5, id(roboto_12), buf);
      }

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16

# Color definitions
color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%

# Import states from Home Assistant
binary_sensor:
  - platform: homeassistant
    name: "Fan State"
    id: fan_state
    entity_id: !secret ceiling_fan_entity
    internal: true
    # Example of fixed on_state handler
    on_state:
      - lambda: |-
          // FIXED: Removed .c_str() from const char* ternary expression
          // The ternary operator (x ? "ON" : "OFF") returns const char*, not std::string
          const char* status_text = x ? "Status: ON" : "Status: OFF";

          // If using LVGL, use lv_color_hex() for color conversion
          // FIXED: Use lv_color_hex() instead of raw integer
          // auto color = lv_color_hex(x ? 0x00FF00 : 0xFF0000);  // Green : Red

          ESP_LOGI("fan", "%s", status_text);

  - platform: homeassistant
    name: "HVAC State"
    id: hvac_state
    entity_id: !secret hvac_entity
    internal: true
    on_state:
      - lambda: |-
          // FIXED: Same fix as fan_state
          const char* status_text = x ? "Status: ON" : "Status: OFF";
          ESP_LOGI("hvac", "%s", status_text);

  - platform: homeassistant
    name: "Camera Enabled"
    id: camera_enabled
    entity_id: !secret camera_entity
    internal: true

sensor:
  - platform: homeassistant
    name: "HVAC Target Temperature"
    id: hvac_target_temp
    entity_id: !secret hvac_entity
    attribute: temperature
    internal: true

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    name: "Fan Speed Text"
    id: fan_speed_text
    entity_id: !secret ceiling_fan_entity
    attribute: percentage
    internal: true

  - platform: homeassistant
    name: "HVAC Mode Text"
    id: hvac_mode_text
    entity_id: !secret hvac_entity
    attribute: hvac_mode
    internal: true

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address

# Touchscreen
touchscreen:
  - platform: xpt2046
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3850
      y_min: 240
      y_max: 3860

# RGB LED outputs
output:
  - platform: ledc
    pin: GPIO4
    id: output_red
  - platform: ledc
    pin: GPIO16
    id: output_green
  - platform: ledc
    pin: GPIO17
    id: output_blue
  - platform: ledc
    pin: GPIO21
    id: output_backlight
    frequency: 1000Hz

light:
  - platform: rgb
    name: "RGB LED"
    id: rgb_led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    output: output_backlight
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# Buttons
button:
  - platform: restart
    name: "Restart Display"

  - platform: template
    name: "Fan Toggle"
    on_press:
      - homeassistant.service:
          service: fan.toggle
          data:
            entity_id: !secret ceiling_fan_entity

# Number inputs
number:
  - platform: template
    name: "Fan Speed Percentage"
    id: fan_speed_control
    min_value: 0
    max_value: 100
    step: 33.33
    optimistic: true
    set_action:
      - homeassistant.service:
          service: fan.set_percentage
          data:
            entity_id: !secret ceiling_fan_entity
            percentage: !lambda "return x;"

  - platform: template
    name: "HVAC Temperature"
    id: hvac_temp_control
    min_value: 60
    max_value: 85
    step: 1
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: !secret hvac_entity
            temperature: !lambda "return x;"

# Select for HVAC modes
select:
  - platform: template
    name: "HVAC Mode"
    id: hvac_mode_select
    options:
      - "off"
      - "heat"
      - "cool"
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: !secret hvac_entity
            hvac_mode: !lambda "return x;"

# Switch for camera
switch:
  - platform: template
    name: "Camera Recording"
    id: camera_recording
    optimistic: true
    turn_on_action:
      - homeassistant.service:
          service: camera.enable_motion_detection
          data:
            entity_id: !secret camera_entity
    turn_off_action:
      - homeassistant.service:
          service: camera.disable_motion_detection
          data:
            entity_id: !secret camera_entity
