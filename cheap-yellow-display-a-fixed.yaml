sensor:
  - platform: homeassistant
    name: "HVAC Target Temperature"
    id: hvac_target_temp
    entity_id: !secret hvac_entity
    attribute: temperature
    internal: true

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    name: "Fan Speed Text"
    id: fan_speed_text
    entity_id: !secret ceiling_fan_entity
    attribute: percentage
    internal: true

  - platform: homeassistant
    name: "HVAC Mode Text"
    id: hvac_mode_text
    entity_id: !secret hvac_entity
    attribute: hvac_mode
    internal: true

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address

# Touchscreen
touchscreen:
  - platform: xpt2046
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3850
      y_min: 240
      y_max: 3860

# RGB LED outputs
output:
  - platform: ledc
    pin: GPIO4
    id: output_red
  - platform: ledc
    pin: GPIO16
    id: output_green
  - platform: ledc
    pin: GPIO17
    id: output_blue
  - platform: ledc
    pin: GPIO21
    id: output_backlight
    frequency: 1000Hz

light:
  - platform: rgb
    name: "RGB LED"
    id: rgb_led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    output: output_backlight
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# Buttons
button:
  - platform: restart
    name: "Restart Display"

  - platform: template
    name: "Fan Toggle"
    on_press:
      - homeassistant.service:
          service: fan.toggle
          data:
            entity_id: !secret ceiling_fan_entity

# Number inputs
number:
  - platform: template
    name: "Fan Speed Percentage"
    id: fan_speed_control
    min_value: 0
    max_value: 100
    step: 33.33
    optimistic: true
    set_action:
      - homeassistant.service:
          service: fan.set_percentage
          data:
            entity_id: !secret ceiling_fan_entity
            percentage: !lambda "return x;"

  - platform: template
    name: "HVAC Temperature"
    id: hvac_temp_control
    min_value: 60
    max_value: 85
    step: 1
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: !secret hvac_entity
            temperature: !lambda "return x;"

# Select for HVAC modes
select:
  - platform: template
    name: "HVAC Mode"
    id: hvac_mode_select
    options:
      - "off"
      - "heat"
      - "cool"
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: !secret hvac_entity
            hvac_mode: !lambda "return x;"
