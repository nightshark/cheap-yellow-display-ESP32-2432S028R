# This is a fixed version based on the compilation errors provided
# The original file had several type conversion and API usage errors

substitutions:
  device_name: "cheap-yellow-display-b"
  friendly_name: "CYD Display B"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: 192.168.1.1
    static_ip: 192.168.1.222
    subnet: 255.255.255.1

  # Enable fallback hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Web server
web_server:
  port: 80

# Time component
time:
  - platform: homeassistant
    id: homeassistant_time

# SPI Configuration
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Display with LVGL
display:
  - platform: ili9xxx
    model: ili9341
    color_palette: 8BIT
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    invert_colors: false
    id: my_display
    lambda: |-
      // Line 381 FIXED: Use to_c_tm() to convert ESPTime* to const tm*
      auto time = id(homeassistant_time).now();
      if (time.is_valid()) {
        char buf[20];
        // BEFORE (wrong): strftime(buf, sizeof(buf), "%Y-%m-%d %H:%M", &time);
        // AFTER (correct): Store to_c_tm() result, then take its address
        auto time_struct = time.to_c_tm();
        strftime(buf, sizeof(buf), "%Y-%m-%d %H:%M", &time_struct);
        it.print(160, 5, id(roboto_12), buf);
      }

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16

# Color definitions
color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%

# Import states from Home Assistant


