# This is a fixed version based on the compilation errors provided
# The original file had several type conversion and API usage errors

substitutions:
  device_name: "cheap-yellow-display-b"
  friendly_name: "CYD Display B"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: 192.168.1.1
    static_ip: 192.168.1.222
    subnet: 255.255.255.1

  # Enable fallback hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Web server
web_server:
  port: 80

# Time component
time:
  - platform: homeassistant
    id: homeassistant_time

# SPI Configuration
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Display with MIPI SPI (newer driver for ESP32-2432S028)
display:
  - platform: mipi_spi
    model: ESP32-2432S028
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    invert_colors: false
    id: my_display
    auto_clear_enabled: false  # Required for LVGL

# LVGL Configuration
lvgl:
  log_level: INFO
  displays:
    - my_display
  touchscreens:
    - my_touchscreen

  pages:
    - id: main_page
      widgets:
        # Header bar
        - obj:
            id: header_bar
            x: 0
            y: 0
            width: 320
            height: 30
            bg_color: 0x0000FF
            border_width: 0
            widgets:
              - label:
                  id: header_label
                  text: "SMART HOME CONTROL"
                  align: CENTER
                  text_color: 0xFFFFFF
                  text_font: roboto_16

        # Time display
        - label:
            id: time_label
            x: 160
            y: 220
            text: "Loading..."
            text_color: 0x808080
            text_font: roboto_12

        # Ceiling Fan Container (Top Left)
        - obj:
            id: fan_container
            x: 5
            y: 35
            width: 150
            height: 85
            border_color: 0x808080
            border_width: 1
            bg_color: 0xFFFFFF
            pad_all: 5
            widgets:
              - label:
                  id: fan_title
                  text: "Ceiling Fan"
                  x: 0
                  y: 0
                  text_font: roboto_16
                  text_color: 0x000000
              - label:
                  id: fan_status_label
                  text: "Status: OFF"
                  x: 0
                  y: 20
                  text_font: roboto_12
                  text_color: 0xFF0000
              - label:
                  id: fan_speed_label
                  text: "Speed: 0%"
                  x: 0
                  y: 35
                  text_font: roboto_12
                  text_color: 0x000000
              - button:
                  id: fan_toggle_btn
                  x: 0
                  y: 50
                  width: 140
                  height: 25
                  on_click:
                    - homeassistant.service:
                        service: fan.toggle
                        data:
                          entity_id: !secret ceiling_fan_entity
                  widgets:
                    - label:
                        text: "TAP TO TOGGLE"
                        text_color: 0x0000FF
                        text_font: roboto_12

        # HVAC Container (Top Right)
        - obj:
            id: hvac_container
            x: 165
            y: 35
            width: 150
            height: 85
            border_color: 0x808080
            border_width: 1
            bg_color: 0xFFFFFF
            pad_all: 5
            widgets:
              - label:
                  id: hvac_title
                  text: "HVAC"
                  x: 0
                  y: 0
                  text_font: roboto_16
                  text_color: 0x000000
              - label:
                  id: hvac_status_label
                  text: "Status: OFF"
                  x: 0
                  y: 20
                  text_font: roboto_12
                  text_color: 0xFF0000
              - label:
                  id: hvac_temp_label
                  text: "Target: --°F"
                  x: 0
                  y: 35
                  text_font: roboto_12
                  text_color: 0x000000
              - label:
                  id: hvac_mode_label
                  text: "Mode: --"
                  x: 0
                  y: 50
                  text_font: roboto_12
                  text_color: 0x000000
              - button:
                  id: hvac_toggle_btn
                  x: 0
                  y: 65
                  width: 140
                  height: 20
                  on_click:
                    - homeassistant.service:
                        service: climate.toggle
                        data:
                          entity_id: !secret hvac_entity
                  widgets:
                    - label:
                        text: "CONTROL"
                        text_color: 0x0000FF
                        text_font: roboto_12

        # Quick Actions Container (Bottom Right)
        - obj:
            id: actions_container
            x: 165
            y: 125
            width: 150
            height: 45
            border_color: 0x808080
            border_width: 1
            bg_color: 0xFFFFFF
            pad_all: 5
            widgets:
              - label:
                  id: actions_title
                  text: "Quick Actions"
                  x: 0
                  y: 0
                  text_font: roboto_16
                  text_color: 0x000000
              - button:
                  id: all_off_btn
                  x: 0
                  y: 20
                  width: 60
                  height: 20
                  on_click:
                    - homeassistant.service:
                        service: script.all_devices_off
                  widgets:
                    - label:
                        text: "All Off"
                        text_color: 0xFF8000
                        text_font: roboto_12
              - button:
                  id: all_on_btn
                  x: 70
                  y: 20
                  width: 60
                  height: 20
                  on_click:
                    - homeassistant.service:
                        service: script.all_devices_on
                  widgets:
                    - label:
                        text: "All On"
                        text_color: 0x00FF00
                        text_font: roboto_12

        # WiFi status
        - label:
            id: wifi_status_label
            x: 5
            y: 220
            text: "WiFi: --"
            text_color: 0x808080
            text_font: roboto_12

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
    weight: bold

# Color definitions
color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_orange
    red: 100%
    green: 50%
    blue: 0%
  - id: light_gray
    red: 80%
    green: 80%
    blue: 80%

# Import states from Home Assistant
binary_sensor:
  - platform: homeassistant
    name: "Fan State"
    id: fan_state
    entity_id: !secret ceiling_fan_entity
    internal: true
    on_state:
      - lvgl.label.update:
          id: fan_status_label
          text: !lambda |-
            return x ? "Status: ON" : "Status: OFF";
      - lvgl.label.update:
          id: fan_status_label
          text_color: !lambda |-
            return x ? 0x00FF00 : 0xFF0000;

  - platform: homeassistant
    name: "HVAC State"
    id: hvac_state
    entity_id: !secret hvac_entity
    internal: true
    on_state:
      - lvgl.label.update:
          id: hvac_status_label
          text: !lambda |-
            return x ? "Status: ON" : "Status: OFF";
      - lvgl.label.update:
          id: hvac_status_label
          text_color: !lambda |-
            return x ? 0x00FF00 : 0xFF0000;

sensor:
  - platform: homeassistant
    name: "HVAC Target Temperature"
    id: hvac_target_temp
    entity_id: !secret hvac_entity
    attribute: temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: hvac_temp_label
          text: !lambda |-
            char buf[32];
            snprintf(buf, sizeof(buf), "Target: %.1f°F", x);
            return buf;

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    name: "Fan Speed Text"
    id: fan_speed_text
    entity_id: !secret ceiling_fan_entity
    attribute: percentage
    internal: true
    on_value:
      - lvgl.label.update:
          id: fan_speed_label
          text: !lambda |-
            return "Speed: " + x + "%";

  - platform: homeassistant
    name: "HVAC Mode Text"
    id: hvac_mode_text
    entity_id: !secret hvac_entity
    attribute: hvac_mode
    internal: true
    on_value:
      - lvgl.label.update:
          id: hvac_mode_label
          text: !lambda |-
            return "Mode: " + x;

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address

# Interval to update time and WiFi status
interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            auto time = id(homeassistant_time).now();
            if (time.is_valid()) {
              char buf[32];
              auto time_struct = time.to_c_tm();
              strftime(buf, sizeof(buf), "%Y-%m-%d %H:%M", &time_struct);
              return buf;
            }
            return "Loading...";
      - lvgl.label.update:
          id: wifi_status_label
          text: !lambda |-
            return id(wifi_component).is_connected() ? "WiFi: Connected" : "WiFi: Disconnected";
      - lvgl.label.update:
          id: wifi_status_label
          text_color: !lambda |-
            return id(wifi_component).is_connected() ? 0x00FF00 : 0xFF0000;

# Touchscreen
touchscreen:
  - platform: xpt2046
    id: my_touchscreen
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3850
      y_min: 240
      y_max: 3860

# RGB LED outputs
output:
  - platform: ledc
    pin: GPIO4
    id: output_red
  - platform: ledc
    pin: GPIO16
    id: output_green
  - platform: ledc
    pin: GPIO17
    id: output_blue
  - platform: ledc
    pin: GPIO21
    id: output_backlight
    frequency: 1000Hz

light:
  - platform: rgb
    name: "RGB LED"
    id: rgb_led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    output: output_backlight
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# Buttons
button:
  - platform: restart
    name: "Restart Display"

  - platform: template
    name: "Fan Toggle"
    on_press:
      - homeassistant.service:
          service: fan.toggle
          data:
            entity_id: !secret ceiling_fan_entity

# Number inputs
number:
  - platform: template
    name: "Fan Speed Percentage"
    id: fan_speed_control
    min_value: 0
    max_value: 100
    step: 33.33
    optimistic: true
    set_action:
      - homeassistant.service:
          service: fan.set_percentage
          data:
            entity_id: !secret ceiling_fan_entity
            percentage: !lambda "return x;"

  - platform: template
    name: "HVAC Temperature"
    id: hvac_temp_control
    min_value: 60
    max_value: 85
    step: 1
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: !secret hvac_entity
            temperature: !lambda "return x;"

# Select for HVAC modes
select:
  - platform: template
    name: "HVAC Mode"
    id: hvac_mode_select
    options:
      - "off"
      - "heat"
      - "cool"
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: !secret hvac_entity
            hvac_mode: !lambda "return x;"
