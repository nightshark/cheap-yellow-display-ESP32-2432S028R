substitutions:
  device_name: "cheap-yellow-display-a"
  friendly_name: "Smart Home Display"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - light.turn_off: rgb_led

# Update WiFi status every 10 seconds
interval:
  - interval: 10s
    then:
      - lvgl.label.update:
          id: wifi_status
          text: !lambda |-
            return id(wifi_component).is_connected() ? "WiFi: Connected" : "WiFi: Disconnected";
      - lvgl.label.update:
          id: wifi_status
          text_color: !lambda |-
            return id(wifi_component).is_connected() ? 0x00FF00 : 0xFF0000;

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  id: wifi_component
  manual_ip:
    static_ip: 192.168.1.113
    gateway: 192.168.1.1
    subnet: 255.255.255.1

  # Enable fallback hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Web server for debugging
web_server:
  port: 80

# -------------------
# Display Configuration
# -------------------

# Define colors
color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_orange
    red: 100%
    green: 50%
    blue: 0%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%
  - id: light_gray
    red: 80%
    green: 80%
    blue: 80%

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12

# SPI Configuration for Display
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Display setup
display:
  - platform: ili9xxx
    model: ili9341
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    invert_colors: true
    color_palette: 8BIT
    auto_clear_enabled: false
    update_interval: never
    id: my_display

# LVGL Graphics
lvgl:
  log_level: INFO
  displays:
    - my_display
  touchscreens:
    - my_touchscreen

  pages:
    - id: main_page
      widgets:
        # Header
        - label:
            align: TOP_MID
            y: 10
            text: "SMART HOME CONTROL"
            text_font: roboto_16
            text_color: 0xFFFFFF

        # Time display
        - label:
            id: time_label
            align: BOTTOM_MID
            y: -5
            text_font: roboto_12
            text_color: 0x808080

        # Fan Control Card
        - obj:
            x: 5
            y: 40
            width: 150
            height: 85
            border_width: 2
            border_color: 0x808080
            bg_color: 0x000000
            radius: 5
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 5
                  y: 5
                  text: "Ceiling Fan"
                  text_font: roboto_16
              - label:
                  id: fan_status
                  align: TOP_LEFT
                  x: 5
                  y: 25
                  text: "Status: OFF"
                  text_font: roboto_12
              - label:
                  id: fan_speed
                  align: TOP_LEFT
                  x: 5
                  y: 40
                  text: "Speed: 0%"
                  text_font: roboto_12
              - button:
                  align: BOTTOM_MID
                  y: -5
                  width: 130
                  height: 25
                  widgets:
                    - label:
                        text: "TOGGLE"
                        text_font: roboto_12
                  on_click:
                    - homeassistant.service:
                        service: fan.toggle
                        data:
                          entity_id: !secret ceiling_fan_entity

        # HVAC Control Card
        - obj:
            x: 165
            y: 40
            width: 150
            height: 85
            border_width: 2
            border_color: 0x808080
            bg_color: 0x000000
            radius: 5
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 5
                  y: 5
                  text: "HVAC"
                  text_font: roboto_16
              - label:
                  id: hvac_status
                  align: TOP_LEFT
                  x: 5
                  y: 25
                  text: "Status: OFF"
                  text_font: roboto_12
              - label:
                  id: hvac_temp
                  align: TOP_LEFT
                  x: 5
                  y: 40
                  text: "Temp: --°F"
                  text_font: roboto_12
              - label:
                  id: hvac_mode
                  align: TOP_LEFT
                  x: 5
                  y: 55
                  text: "Mode: --"
                  text_font: roboto_12

        # Quick Actions Card
        - obj:
            x: 5
            y: 135
            width: 150
            height: 75
            border_width: 2
            border_color: 0x808080
            bg_color: 0x000000
            radius: 5
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 5
                  y: 5
                  text: "Quick Actions"
                  text_font: roboto_16
              - button:
                  align: BOTTOM_LEFT
                  x: 5
                  y: -5
                  width: 65
                  height: 30
                  bg_color: 0xFF6600
                  widgets:
                    - label:
                        text: "All Off"
                        text_font: roboto_12
                  on_click:
                    - homeassistant.service:
                        service: script.all_devices_off
              - button:
                  align: BOTTOM_RIGHT
                  x: -5
                  y: -5
                  width: 65
                  height: 30
                  bg_color: 0x00FF00
                  widgets:
                    - label:
                        text: "All On"
                        text_font: roboto_12
                  on_click:
                    - homeassistant.service:
                        service: script.all_devices_on

        # WiFi Status
        - label:
            id: wifi_status
            align: BOTTOM_LEFT
            x: 5
            y: -5
            text: "WiFi: Connected"
            text_font: roboto_12
            text_color: 0x00FF00

# Touchscreen Configuration
touchscreen:
  - platform: xpt2046
    id: my_touchscreen
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3850
      y_min: 240
      y_max: 3860
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );

# -------------------
# RGB LED on the back
# -------------------
output:
  - platform: ledc
    pin: GPIO4
    id: output_red
  - platform: ledc
    pin: GPIO16
    id: output_green
  - platform: ledc
    pin: GPIO17
    id: output_blue
  - platform: ledc
    pin: GPIO21
    id: output_backlight
    frequency: 1000Hz

light:
  - platform: rgb
    name: "RGB LED"
    id: rgb_led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    output: output_backlight
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# -------------------
# Time Component
# -------------------
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: time_label
              text: !lambda |-
                static char buf[32];
                auto time = id(homeassistant_time).now();
                strftime(buf, sizeof(buf), "%Y-%m-%d %H:%M", &time);
                return buf;

# -------------------
# Sensors from Home Assistant
# -------------------

# Import states from Home Assistant
binary_sensor:
  - platform: homeassistant
    name: "Fan State"
    id: fan_state
    entity_id: !secret ceiling_fan_entity
    internal: true
    on_state:
      - lvgl.label.update:
          id: fan_status
          text: !lambda |-
            return x ? "Status: ON" : "Status: OFF";
      - lvgl.label.update:
          id: fan_status
          text_color: !lambda |-
            return x ? 0x00FF00 : 0xFF0000;

  - platform: homeassistant
    name: "HVAC State"
    id: hvac_state
    entity_id: !secret hvac_entity
    internal: true
    on_state:
      - lvgl.label.update:
          id: hvac_status
          text: !lambda |-
            return x ? "Status: ON" : "Status: OFF";
      - lvgl.label.update:
          id: hvac_status
          text_color: !lambda |-
            return x ? 0x00FF00 : 0xFF0000;


sensor:
  - platform: homeassistant
    name: "HVAC Target Temperature"
    id: hvac_target_temp
    entity_id: !secret hvac_entity
    attribute: temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: hvac_temp
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Temp: %.1f°F", x);
            return buf;

  - platform: homeassistant
    name: "HVAC Current Temperature"
    id: hvac_current_temp
    entity_id: !secret hvac_entity
    attribute: current_temperature
    internal: true

  # WiFi Signal Sensor
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    name: "Fan Speed Text"
    id: fan_speed_text
    entity_id: !secret ceiling_fan_entity
    attribute: percentage
    internal: true
    on_value:
      - lvgl.label.update:
          id: fan_speed
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Speed: %s%%", x.c_str());
            return buf;

  - platform: homeassistant
    name: "HVAC Mode Text"
    id: hvac_mode_text
    entity_id: !secret hvac_entity
    attribute: hvac_mode
    internal: true
    on_value:
      - lvgl.label.update:
          id: hvac_mode
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Mode: %s", x.c_str());
            return buf;

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address

# -------------------
# Buttons for Manual Control
# -------------------
button:
  - platform: restart
    name: "Restart Display"

  - platform: template
    name: "Fan Speed Up"
    on_press:
      - homeassistant.service:
          service: fan.increase_speed
          data:
            entity_id: !secret ceiling_fan_entity

  - platform: template
    name: "Fan Speed Down"
    on_press:
      - homeassistant.service:
          service: fan.decrease_speed
          data:
            entity_id: !secret ceiling_fan_entity

  - platform: template
    name: "HVAC Temp Up"
    on_press:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: !secret hvac_entity
            temperature: !lambda "return id(hvac_target_temp).state + 1;"

  - platform: template
    name: "HVAC Temp Down"
    on_press:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: !secret hvac_entity
            temperature: !lambda "return id(hvac_target_temp).state - 1;"

# -------------------
# Number inputs for advanced control
# -------------------
number:
  - platform: template
    name: "Fan Speed Percentage"
    id: fan_speed_control
    min_value: 0
    max_value: 100
    step: 33.33
    optimistic: true
    set_action:
      - homeassistant.service:
          service: fan.set_percentage
          data:
            entity_id: !secret ceiling_fan_entity
            percentage: !lambda "return x;"

  - platform: template
    name: "HVAC Temperature"
    id: hvac_temp_control
    min_value: 60
    max_value: 85
    step: 1
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: !secret hvac_entity
            temperature: !lambda "return x;"

# -------------------
# Select for HVAC modes
# -------------------
select:
  - platform: template
    name: "HVAC Mode"
    id: hvac_mode_select
    options:
      - "off"
      - "heat"
      - "cool"
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: !secret hvac_entity
            hvac_mode: !lambda "return x;"
