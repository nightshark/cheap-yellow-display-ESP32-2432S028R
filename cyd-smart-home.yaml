substitutions:
  device_name: "cyd-smart-home-display"
  friendly_name: "Smart Home Display"

  # Home Assistant Entity IDs
  temperature_sensor: "sensor.your_temperature_sensor"
  humidity_sensor: "sensor.your_humidity_sensor"
  ceiling_fan: "fan.your_ceiling_fan"

# Import common configurations
packages:
  common: !include templates/common.yaml
  device: !include templates/ESP32-2432S028R.yaml

esphome:
  on_boot:
    priority: 600
    then:
      - light.turn_off: rgb_led

# Update WiFi status every 10 seconds
interval:
  - interval: 10s
    then:
      - lvgl.label.update:
          id: wifi_status
          text: !lambda |-
            return std::string(id(wifi_component).is_connected() ? "WiFi: Connected" : "WiFi: Disconnected");
      - lvgl.label.update:
          id: wifi_status
          text_color: !lambda |-
            return id(wifi_component).is_connected() ? lv_color_hex(0x00FF00) : lv_color_hex(0xFF0000);

wifi:
  id: wifi_component
  manual_ip:
    static_ip: 192.168.1.113
    gateway: 192.168.1.1
    subnet: 255.255.255.1

# -------------------
# Display Configuration
# -------------------

# Define colors
color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_orange
    red: 100%
    green: 50%
    blue: 0%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%
  - id: light_gray
    red: 80%
    green: 80%
    blue: 80%

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
  - file: "gfonts://Roboto"
    id: roboto_32
    size: 32
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12

# LVGL Graphics
lvgl:
  log_level: INFO

  pages:
    - id: main_page
      widgets:
        # Header
        - label:
            align: TOP_MID
            y: 5
            text: "SMART HOME"
            text_font: roboto_16
            text_color: 0xFFFFFF

        # Temperature Card (Top Left)
        - obj:
            x: 5
            y: 30
            width: 150
            height: 60
            border_width: 2
            border_color: 0x00AAFF
            bg_color: 0x001F3F
            radius: 5
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 5
                  y: 5
                  text: "Temperature"
                  text_font: roboto_12
                  text_color: 0xAADDFF
              - label:
                  id: temp_value
                  align: CENTER
                  y: 5
                  text: "--°F"
                  text_font: roboto_24
                  text_color: 0xFFFFFF

        # Humidity Card (Top Right)
        - obj:
            x: 165
            y: 30
            width: 150
            height: 60
            border_width: 2
            border_color: 0x00FF88
            bg_color: 0x003F2F
            radius: 5
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 5
                  y: 5
                  text: "Humidity"
                  text_font: roboto_12
                  text_color: 0xAAFFDD
              - label:
                  id: humidity_value
                  align: CENTER
                  y: 5
                  text: "--%"
                  text_font: roboto_24
                  text_color: 0xFFFFFF

        # Fan Control Card (Bottom)
        - obj:
            x: 5
            y: 100
            width: 310
            height: 105
            border_width: 2
            border_color: 0xFFAA00
            bg_color: 0x2F2000
            radius: 5
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 5
                  y: 5
                  text: "Ceiling Fan"
                  text_font: roboto_16
                  text_color: 0xFFDDAA
              - label:
                  id: fan_status
                  align: TOP_LEFT
                  x: 5
                  y: 30
                  text: "Status: OFF"
                  text_font: roboto_12
                  text_color: 0xFF0000
              - label:
                  id: fan_speed
                  align: TOP_LEFT
                  x: 5
                  y: 50
                  text: "Speed: 0%"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
              - button:
                  align: BOTTOM_LEFT
                  x: 5
                  y: -5
                  width: 90
                  height: 30
                  bg_color: 0xFF6600
                  widgets:
                    - label:
                        text: "TOGGLE"
                        text_font: roboto_12
                  on_click:
                    - homeassistant.service:
                        service: fan.toggle
                        data:
                          entity_id: ${ceiling_fan}
              - button:
                  align: BOTTOM_MID
                  y: -5
                  width: 90
                  height: 30
                  bg_color: 0x4444FF
                  widgets:
                    - label:
                        text: "SPEED +"
                        text_font: roboto_12
                  on_click:
                    - homeassistant.service:
                        service: fan.increase_speed
                        data:
                          entity_id: ${ceiling_fan}
              - button:
                  align: BOTTOM_RIGHT
                  x: -5
                  y: -5
                  width: 90
                  height: 30
                  bg_color: 0x4444FF
                  widgets:
                    - label:
                        text: "SPEED -"
                        text_font: roboto_12
                  on_click:
                    - homeassistant.service:
                        service: fan.decrease_speed
                        data:
                          entity_id: ${ceiling_fan}

        # Time display
        - label:
            id: time_label
            align: BOTTOM_MID
            y: -5
            text_font: roboto_12
            text_color: 0x808080

        # WiFi Status
        - label:
            id: wifi_status
            align: BOTTOM_LEFT
            x: 5
            y: -5
            text: "WiFi: Connected"
            text_font: roboto_12
            text_color: 0x00FF00

# -------------------
# Time Component
# -------------------
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: /10
        then:
          - lvgl.label.update:
              id: time_label
              text: !lambda |-
                char buf[32];
                auto time = id(homeassistant_time).now();
                sprintf(buf, "%02d:%02d:%02d", time.hour, time.minute, time.second);
                return std::string(buf);

# -------------------
# Sensors from Home Assistant
# -------------------

# Import states from Home Assistant
binary_sensor:
  - platform: homeassistant
    name: "Fan State"
    id: fan_state
    entity_id: ${ceiling_fan}
    internal: true
    on_state:
      - lvgl.label.update:
          id: fan_status
          text: !lambda |-
            return std::string(x ? "Status: ON" : "Status: OFF");
      - lvgl.label.update:
          id: fan_status
          text_color: !lambda |-
            return x ? lv_color_hex(0x00FF00) : lv_color_hex(0xFF0000);

sensor:
  - platform: homeassistant
    name: "Indoor Temperature"
    id: indoor_temp
    entity_id: ${temperature_sensor}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_value
          text: !lambda |-
            char buf[32];
            sprintf(buf, "%.1f°F", x);
            return std::string(buf);

  - platform: homeassistant
    name: "Indoor Humidity"
    id: indoor_humidity
    entity_id: ${humidity_sensor}
    internal: true
    on_value:
      - lvgl.label.update:
          id: humidity_value
          text: !lambda |-
            char buf[32];
            sprintf(buf, "%.0f%%", x);
            return std::string(buf);

  # WiFi Signal Sensor
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    name: "Fan Speed Text"
    id: fan_speed_text
    entity_id: ${ceiling_fan}
    attribute: percentage
    internal: true
    on_value:
      - lvgl.label.update:
          id: fan_speed
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Speed: %s%%", x.c_str());
            return std::string(buf);

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address

# -------------------
# Buttons for Manual Control
# -------------------
button:
  - platform: restart
    name: "Restart Display"
