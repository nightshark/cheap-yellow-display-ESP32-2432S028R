substitutions:
  device_name: "cyd-smart-home"
  friendly_name: "Smart Home Display"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Web server for debugging
web_server:
  port: 80

# -------------------
# Display Configuration
# -------------------

# Define colors (LVGL uses hex format)
color:
  - id: color_blue
    hex: "0066CC"
  - id: color_green
    hex: "00CC00"
  - id: color_red
    hex: "CC0000"
  - id: color_orange
    hex: "FF8800"
  - id: color_gray
    hex: "808080"
  - id: color_light_gray
    hex: "CCCCCC"
  - id: color_white
    hex: "FFFFFF"
  - id: color_black
    hex: "000000"

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
    bpp: 4
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
    weight: bold
    bpp: 4
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
    bpp: 4
  - file: "gfonts://Roboto"
    id: roboto_14
    size: 14
    bpp: 4

# SPI Configuration for Display
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Display setup
display:
  - platform: ili9xxx
    model: ili9342
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    invert_colors: true
    id: my_display
    auto_clear_enabled: false

# Touchscreen Configuration
touchscreen:
  - platform: xpt2046
    id: my_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3850
      y_min: 240
      y_max: 3860
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );

# -------------------
# LVGL Configuration
# -------------------
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch

  color_depth: 16
  bg_color: 0x000000

  # Define styles
  style_definitions:
    - id: style_header
      bg_color: 0x0066CC
      bg_opa: COVER
      text_color: 0xFFFFFF
      text_font: roboto_16
      text_align: center
      pad_all: 5

    - id: style_card
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0x808080
      border_width: 2
      border_opa: COVER
      radius: 8
      pad_all: 10

    - id: style_card_title
      text_color: 0x000000
      text_font: roboto_16
      text_align: left

    - id: style_status_on
      text_color: 0x00CC00
      text_font: roboto_12

    - id: style_status_off
      text_color: 0xCC0000
      text_font: roboto_12

    - id: style_info_text
      text_color: 0x000000
      text_font: roboto_12

    - id: style_button_text
      text_color: 0x0066CC
      text_font: roboto_12

    - id: style_footer
      text_color: 0x808080
      text_font: roboto_12
      bg_opa: TRANSP

  pages:
    - id: main_page
      widgets:
        # Main container with grid layout
        - obj:
            width: 100%
            height: 100%
            pad_all: 0
            bg_opa: COVER
            bg_color: 0x000000
            layout:
              type: grid
              grid_rows: [30px, fr(1), fr(1), 25px]  # Header, Row1, Row2, Footer
              grid_columns: [fr(1), fr(1)]  # 2 equal columns
              pad_row: 5
              pad_column: 5
            widgets:
              # ===== HEADER (spans both columns) =====
              - obj:
                  id: header_container
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_column_span: 2
                  styles: style_header
                  widgets:
                    - label:
                        text: "SMART HOME CONTROL"
                        align: CENTER

              # ===== FAN CARD (Row 1, Column 0) =====
              - obj:
                  id: fan_card
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  styles: style_card
                  clickable: true
                  on_click:
                    - homeassistant.service:
                        service: fan.toggle
                        data:
                          entity_id: fan.ifan_bedroom_001_fan
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: start
                    flex_align_cross: start
                  widgets:
                    - label:
                        id: fan_title
                        text: "Ceiling Fan"
                        styles: style_card_title
                    - label:
                        id: fan_status_label
                        text: "Status: OFF"
                        styles: style_status_off
                    - label:
                        id: fan_speed_label
                        text: "Speed: 0%"
                        styles: style_info_text
                    - label:
                        text: "[TAP TO TOGGLE]"
                        styles: style_button_text

              # ===== HVAC CARD (Row 1, Column 1) =====
              - obj:
                  id: hvac_card
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  styles: style_card
                  clickable: true
                  on_click:
                    - homeassistant.service:
                        service: climate.toggle
                        data:
                          entity_id: climate.t6_pro_z_wave_thermostat
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: start
                    flex_align_cross: start
                  widgets:
                    - label:
                        id: hvac_title
                        text: "HVAC"
                        styles: style_card_title
                    - label:
                        id: hvac_status_label
                        text: "Status: OFF"
                        styles: style_status_off
                    - label:
                        id: hvac_temp_label
                        text: "Target: --°F"
                        styles: style_info_text
                    - label:
                        id: hvac_mode_label
                        text: "Mode: --"
                        styles: style_info_text
                    - label:
                        text: "[TAP TO CONTROL]"
                        styles: style_button_text

              # ===== QUICK ACTIONS CARD (Row 2, spans both columns) =====
              - obj:
                  id: quick_actions_card
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 0
                  grid_cell_column_span: 2
                  styles: style_card
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: start
                    flex_align_cross: stretch
                  widgets:
                    - label:
                        text: "Quick Actions"
                        styles: style_card_title
                    - obj:
                        id: buttons_container
                        layout: horizontal
                        pad_all: 2
                        widgets:
                          - btn:
                              id: all_off_btn
                              width: 45%
                              on_click:
                                - homeassistant.service:
                                    service: script.all_devices_off
                              widgets:
                                - label:
                                    text: "All Off"
                                    text_color: 0xFF8800
                          - btn:
                              id: all_on_btn
                              width: 45%
                              on_click:
                                - homeassistant.service:
                                    service: script.all_devices_on
                              widgets:
                                - label:
                                    text: "All On"
                                    text_color: 0x00CC00

              # ===== FOOTER (spans both columns) =====
              - obj:
                  id: footer_container
                  grid_cell_row_pos: 3
                  grid_cell_column_pos: 0
                  grid_cell_column_span: 2
                  styles: style_footer
                  layout: horizontal
                  widgets:
                    - label:
                        id: wifi_status_label
                        text: "WiFi: --"
                    - label:
                        id: time_label
                        text: "--:--"
                        align: right

# Update LVGL labels based on Home Assistant states
  on_idle:
    - lambda: |-
        // Update Fan Status
        auto fan_status = id(fan_status_label);
        if (id(fan_state).state) {
          fan_status->set_text("Status: ON");
          fan_status->add_style(id(style_status_on));
          fan_status->remove_style(id(style_status_off));
        } else {
          fan_status->set_text("Status: OFF");
          fan_status->add_style(id(style_status_off));
          fan_status->remove_style(id(style_status_on));
        }

        // Update Fan Speed
        std::string speed_text = "Speed: " + id(fan_speed_text).state + "%";
        id(fan_speed_label)->set_text(speed_text.c_str());

        // Update HVAC Status
        auto hvac_status = id(hvac_status_label);
        if (id(hvac_state).state) {
          hvac_status->set_text("Status: ON");
          hvac_status->add_style(id(style_status_on));
          hvac_status->remove_style(id(style_status_off));
        } else {
          hvac_status->set_text("Status: OFF");
          hvac_status->add_style(id(style_status_off));
          hvac_status->remove_style(id(style_status_on));
        }

        // Update HVAC Temperature
        char temp_buf[32];
        snprintf(temp_buf, sizeof(temp_buf), "Target: %.1f°F", id(hvac_target_temp).state);
        id(hvac_temp_label)->set_text(temp_buf);

        // Update HVAC Mode
        std::string mode_text = "Mode: " + id(hvac_mode_text).state;
        id(hvac_mode_label)->set_text(mode_text.c_str());

        // Update WiFi Status
        if (id(wifi_component).is_connected()) {
          id(wifi_status_label)->set_text("WiFi: Connected");
        } else {
          id(wifi_status_label)->set_text("WiFi: Disconnected");
        }

        // Update Time
        auto time = id(homeassistant_time).now();
        char time_buf[32];
        snprintf(time_buf, sizeof(time_buf), "%02d:%02d", time.hour, time.minute);
        id(time_label)->set_text(time_buf);

# -------------------
# RGB LED on the back
# -------------------
output:
  - platform: ledc
    pin: GPIO4
    id: output_red
  - platform: ledc
    pin: GPIO16
    id: output_green
  - platform: ledc
    pin: GPIO17
    id: output_blue
  - platform: ledc
    pin: GPIO21
    id: output_backlight
    frequency: 1000Hz

light:
  - platform: rgb
    name: "RGB LED"
    id: rgb_led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    output: output_backlight
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# -------------------
# Time Component
# -------------------
time:
  - platform: homeassistant
    id: homeassistant_time

# -------------------
# Sensors from Home Assistant
# -------------------

# Import states from Home Assistant
binary_sensor:
  - platform: homeassistant
    name: "Fan State"
    id: fan_state
    entity_id: fan.ifan_bedroom_001_fan
    internal: true

  - platform: homeassistant
    name: "HVAC State"
    id: hvac_state
    entity_id: climate.t6_pro_z_wave_thermostat
    internal: true

sensor:
  - platform: homeassistant
    name: "HVAC Target Temperature"
    id: hvac_target_temp
    entity_id: climate.t6_pro_z_wave_thermostat
    attribute: temperature
    internal: true

  - platform: homeassistant
    name: "HVAC Current Temperature"
    id: hvac_current_temp
    entity_id: climate.t6_pro_z_wave_thermostat
    attribute: current_temperature
    internal: true

  # WiFi Signal Sensor
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    name: "Fan Speed Text"
    id: fan_speed_text
    entity_id: fan.ifan_bedroom_001_fan
    attribute: percentage
    internal: true

  - platform: homeassistant
    name: "HVAC Mode Text"
    id: hvac_mode_text
    entity_id: climate.t6_pro_z_wave_thermostat
    attribute: hvac_mode
    internal: true

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address

# -------------------
# Buttons for Manual Control
# -------------------
button:
  - platform: restart
    name: "Restart Display"

  - platform: template
    name: "Fan Speed Up"
    on_press:
      - homeassistant.service:
          service: fan.increase_speed
          data:
            entity_id: fan.ifan_bedroom_001_fan

  - platform: template
    name: "Fan Speed Down"
    on_press:
      - homeassistant.service:
          service: fan.decrease_speed
          data:
            entity_id: fan.ifan_bedroom_001_fan

  - platform: template
    name: "HVAC Temp Up"
    on_press:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.t6_pro_z_wave_thermostat
            temperature: !lambda "return id(hvac_target_temp).state + 1;"

  - platform: template
    name: "HVAC Temp Down"
    on_press:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.t6_pro_z_wave_thermostat
            temperature: !lambda "return id(hvac_target_temp).state - 1;"

# -------------------
# Number inputs for advanced control
# -------------------
number:
  - platform: template
    name: "Fan Speed Percentage"
    id: fan_speed_control
    min_value: 0
    max_value: 100
    step: 33.33
    optimistic: true
    set_action:
      - homeassistant.service:
          service: fan.set_percentage
          data:
            entity_id: fan.ifan_bedroom_001_fan
            percentage: !lambda "return x;"

  - platform: template
    name: "HVAC Temperature"
    id: hvac_temp_control
    min_value: 60
    max_value: 85
    step: 1
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.t6_pro_z_wave_thermostat
            temperature: !lambda "return x;"

# -------------------
# Select for HVAC modes
# -------------------
select:
  - platform: template
    name: "HVAC Mode"
    id: hvac_mode_select
    options:
      - "off"
      - "heat"
      - "cool"
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: climate.t6_pro_z_wave_thermostat
            hvac_mode: !lambda "return x;"

wifi:
  id: wifi_component
