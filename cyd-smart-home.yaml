substitutions:
  device_name: "cyd-smart-home"
  friendly_name: "Smart Home Display"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Web server for debugging
web_server:
  port: 80

# -------------------
# Display Configuration
# -------------------

# Define colors
color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_orange
    red: 100%
    green: 50%
    blue: 0%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%
  - id: light_gray
    red: 80%
    green: 80%
    blue: 80%

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
    weight: bold
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12

# SPI Configuration for Display
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Display setup
display:
  - platform: ili9xxx
    model: ili9342
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    invert_colors: true
    id: my_display
    lambda: |-
      // Header
      it.filled_rectangle(0, 0, 320, 30, id(my_blue));
      it.print(160, 5, id(roboto_16), id(my_white), TextAlign::TOP_CENTER, "SMART HOME CONTROL");

      // Current time
      it.strftime(160, 220, id(roboto_12), id(my_gray), TextAlign::TOP_CENTER, "%Y-%m-%d %H:%M", id(homeassistant_time).now());

      // Ceiling Fan Section (Top Left)
      it.rectangle(5, 35, 150, 85, id(my_gray));
      it.print(10, 40, id(roboto_16), id(my_black), "Ceiling Fan");
      it.printf(10, 60, id(roboto_12), id(fan_state).state ? id(my_green) : id(my_red),
                "Status: %s", id(fan_state).state ? "ON" : "OFF");
      it.printf(10, 75, id(roboto_12), id(my_black), "Speed: %s%%", id(fan_speed_text).state.c_str());
      it.print(10, 90, id(roboto_12), id(my_blue), "[TAP TO TOGGLE]");

      // HVAC Section (Top Right)
      it.rectangle(165, 35, 150, 85, id(my_gray));
      it.print(170, 40, id(roboto_16), id(my_black), "HVAC");
      it.printf(170, 60, id(roboto_12), id(hvac_state).state ? id(my_green) : id(my_red),
                "Status: %s", id(hvac_state).state ? "ON" : "OFF");
      it.printf(170, 75, id(roboto_12), id(my_black), "Target: %.1f°F", id(hvac_target_temp).state);
      it.printf(170, 90, id(roboto_12), id(my_black), "Mode: %s", id(hvac_mode_text).state.c_str());
      it.print(170, 105, id(roboto_12), id(my_blue), "[TAP TO CONTROL]");

      // Camera Status (Bottom Left)
      it.rectangle(5, 125, 150, 45, id(my_gray));
      it.print(10, 130, id(roboto_16), id(my_black), "Camera");
      it.printf(10, 150, id(roboto_12), id(camera_enabled).state ? id(my_green) : id(my_red),
                "Status: %s", id(camera_enabled).state ? "ACTIVE" : "OFF");
      it.print(10, 165, id(roboto_12), id(my_blue), "[TAP TO VIEW]");

      // Quick Controls (Bottom Right)
      it.rectangle(165, 125, 150, 45, id(my_gray));
      it.print(170, 130, id(roboto_16), id(my_black), "Quick Actions");
      it.print(170, 150, id(roboto_12), id(my_orange), "All Off");
      it.print(250, 150, id(roboto_12), id(my_green), "All On");

      // Wi-Fi Status
      if (id(wifi_component).is_connected()) {
        it.print(5, 220, id(roboto_12), id(my_green), "WiFi: Connected");
      } else {
        it.print(5, 220, id(roboto_12), id(my_red), "WiFi: Disconnected");
      }

# Touchscreen Configuration
touchscreen:
  - platform: xpt2046
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3850
      y_min: 240
      y_max: 3860
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );
    binary_sensor:
      # Ceiling Fan Control Area
      - name: "Fan Touch Area"
        id: fan_touch_area
        x_min: 5
        x_max: 155
        y_min: 35
        y_max: 120
        on_press:
          - homeassistant.service:
              service: fan.toggle
              data:
                entity_id: !secret ceiling_fan_entity

      # HVAC Control Area
      - name: "HVAC Touch Area"
        id: hvac_touch_area
        x_min: 165
        x_max: 315
        y_min: 35
        y_max: 120
        on_press:
          - homeassistant.service:
              service: climate.toggle
              data:
                entity_id: !secret hvac_entity

      # Camera View Area
      - name: "Camera Touch Area"
        id: camera_touch_area
        x_min: 5
        x_max: 155
        y_min: 125
        y_max: 170
        on_press:
          - homeassistant.service:
              service: camera.turn_on
              data:
                entity_id: !secret camera_entity

      # All Off Button
      - name: "All Off Touch"
        id: all_off_touch
        x_min: 165
        x_max: 240
        y_min: 140
        y_max: 170
        on_press:
          - homeassistant.service:
              service: script.all_devices_off

      # All On Button
      - name: "All On Touch"
        id: all_on_touch
        x_min: 241
        x_max: 315
        y_min: 140
        y_max: 170
        on_press:
          - homeassistant.service:
              service: script.all_devices_on

# -------------------
# RGB LED on the back
# -------------------
output:
  - platform: ledc
    pin: GPIO4
    id: output_red
  - platform: ledc
    pin: GPIO16
    id: output_green
  - platform: ledc
    pin: GPIO17
    id: output_blue
  - platform: ledc
    pin: GPIO21
    id: output_backlight
    frequency: 1000Hz

light:
  - platform: rgb
    name: "RGB LED"
    id: rgb_led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    output: output_backlight
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# -------------------
# Time Component
# -------------------
time:
  - platform: homeassistant
    id: homeassistant_time

# -------------------
# Sensors from Home Assistant
# -------------------

# Import states from Home Assistant
binary_sensor:
  - platform: homeassistant
    name: "Fan State"
    id: fan_state
    entity_id: !secret ceiling_fan_entity
    internal: true

  - platform: homeassistant
    name: "HVAC State"
    id: hvac_state
    entity_id: !secret hvac_entity
    internal: true

  - platform: homeassistant
    name: "Camera Enabled"
    id: camera_enabled
    entity_id: !secret camera_entity
    internal: true


sensor:
  - platform: homeassistant
    name: "HVAC Target Temperature"
    id: hvac_target_temp
    entity_id: !secret hvac_entity
    attribute: temperature
    internal: true

  - platform: homeassistant
    name: "HVAC Current Temperature"
    id: hvac_current_temp
    entity_id: !secret hvac_entity
    attribute: current_temperature
    internal: true

  # WiFi Signal Sensor
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    name: "Fan Speed Text"
    id: fan_speed_text
    entity_id: !secret ceiling_fan_entity
    attribute: percentage
    internal: true

  - platform: homeassistant
    name: "HVAC Mode Text"
    id: hvac_mode_text
    entity_id: !secret hvac_entity
    attribute: hvac_mode
    internal: true

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address

# -------------------
# Buttons for Manual Control
# -------------------
button:
  - platform: restart
    name: "Restart Display"

  - platform: template
    name: "Fan Speed Up"
    on_press:
      - homeassistant.service:
          service: fan.increase_speed
          data:
            entity_id: !secret ceiling_fan_entity

  - platform: template
    name: "Fan Speed Down"
    on_press:
      - homeassistant.service:
          service: fan.decrease_speed
          data:
            entity_id: !secret ceiling_fan_entity

  - platform: template
    name: "HVAC Temp Up"
    on_press:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: !secret hvac_entity
            temperature: !lambda "return id(hvac_target_temp).state + 1;"

  - platform: template
    name: "HVAC Temp Down"
    on_press:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: !secret hvac_entity
            temperature: !lambda "return id(hvac_target_temp).state - 1;"

# -------------------
# Number inputs for advanced control
# -------------------
number:
  - platform: template
    name: "Fan Speed Percentage"
    id: fan_speed_control
    min_value: 0
    max_value: 100
    step: 33.33
    optimistic: true
    set_action:
      - homeassistant.service:
          service: fan.set_percentage
          data:
            entity_id: !secret ceiling_fan_entity
            percentage: !lambda "return x;"

  - platform: template
    name: "HVAC Temperature"
    id: hvac_temp_control
    min_value: 60
    max_value: 85
    step: 1
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: !secret hvac_entity
            temperature: !lambda "return x;"

# -------------------
# Select for HVAC modes
# -------------------
select:
  - platform: template
    name: "HVAC Mode"
    id: hvac_mode_select
    options:
      - "off"
      - "heat"
      - "cool"
    optimistic: true
    set_action:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: !secret hvac_entity
            hvac_mode: !lambda "return x;"

# -------------------
# Switch for camera recording
# -------------------
switch:
  - platform: template
    name: "Camera Recording"
    id: camera_recording
    optimistic: true
    turn_on_action:
      - homeassistant.service:
          service: camera.enable_motion_detection
          data:
            entity_id: !secret camera_entity
    turn_off_action:
      - homeassistant.service:
          service: camera.disable_motion_detection
          data:
            entity_id: !secret camera_entity

wifi:
  id: wifi_component
