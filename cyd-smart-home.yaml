substitutions:
  device_name: "cyd-smart-home-display"
  friendly_name: "Smart Home Display"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - light.turn_off: rgb_led

# Update WiFi status every 10 seconds
interval:
  - interval: 10s
    then:
      - lvgl.label.update:
          id: wifi_status
          text: !lambda |-
            return id(wifi_component).is_connected() ? "WiFi: Connected" : "WiFi: Disconnected";
      - lvgl.label.update:
          id: wifi_status
          text_color: !lambda |-
            return id(wifi_component).is_connected() ? lv_color_hex(0x00FF00) : lv_color_hex(0xFF0000);

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  id: wifi_component
  manual_ip:
    static_ip: 192.168.1.113
    gateway: 192.168.1.1
    subnet: 255.255.255.1

  # Enable fallback hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Web server for debugging
web_server:
  port: 80

# -------------------
# Display Configuration
# -------------------

# Define colors
color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_orange
    red: 100%
    green: 50%
    blue: 0%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%
  - id: light_gray
    red: 80%
    green: 80%
    blue: 80%

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
    weight: bold
  - file: "gfonts://Roboto"
    id: roboto_32
    size: 32
    weight: bold
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12

# SPI Configuration for Display
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
    interface: hardware
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Display setup
display:
  - platform: mipi_spi
    model: ILI9341
    id: my_display
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    invert_colors: true
    color_depth: 16
    dimensions:
      width: 320
      height: 240
    auto_clear_enabled: false
    update_interval: never

# LVGL Graphics
lvgl:
  log_level: INFO

  pages:
    - id: main_page
      widgets:
        # Header
        - label:
            align: TOP_MID
            y: 10
            text: "HOME ENVIRONMENT"
            text_font: roboto_24
            text_color: 0xFFFFFF

        # Temperature Card
        - obj:
            x: 10
            y: 60
            width: 300
            height: 70
            border_width: 2
            border_color: 0x00AAFF
            bg_color: 0x001F3F
            radius: 8
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 10
                  y: 10
                  text: "Temperature"
                  text_font: roboto_16
                  text_color: 0xAADDFF
              - label:
                  id: temp_value
                  align: CENTER
                  y: 5
                  text: "--°F"
                  text_font: roboto_32
                  text_color: 0xFFFFFF

        # Humidity Card
        - obj:
            x: 10
            y: 140
            width: 300
            height: 70
            border_width: 2
            border_color: 0x00FF88
            bg_color: 0x003F2F
            radius: 8
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 10
                  y: 10
                  text: "Humidity"
                  text_font: roboto_16
                  text_color: 0xAAFFDD
              - label:
                  id: humidity_value
                  align: CENTER
                  y: 5
                  text: "--%"
                  text_font: roboto_32
                  text_color: 0xFFFFFF

        # Time display
        - label:
            id: time_label
            align: BOTTOM_MID
            y: -20
            text_font: roboto_12
            text_color: 0x808080

        # WiFi Status
        - label:
            id: wifi_status
            align: BOTTOM_LEFT
            x: 5
            y: -5
            text: "WiFi: Connected"
            text_font: roboto_12
            text_color: 0x00FF00

# Touchscreen Configuration
touchscreen:
  - platform: xpt2046
    id: my_touchscreen
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3850
      y_min: 240
      y_max: 3860
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );

# -------------------
# RGB LED on the back
# -------------------
output:
  - platform: ledc
    pin: GPIO4
    id: output_red
  - platform: ledc
    pin: GPIO16
    id: output_green
  - platform: ledc
    pin: GPIO17
    id: output_blue
  - platform: ledc
    pin: GPIO21
    id: output_backlight
    frequency: 1000Hz

light:
  - platform: rgb
    name: "RGB LED"
    id: rgb_led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    output: output_backlight
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# -------------------
# Time Component
# -------------------
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: /10
        then:
          - lvgl.label.update:
              id: time_label
              text: !lambda |-
                char buf[32];
                auto time = id(homeassistant_time).now();
                sprintf(buf, "%02d:%02d:%02d", time.hour, time.minute, time.second);
                return buf;

# -------------------
# Sensors from Home Assistant
# -------------------

sensor:
  - platform: homeassistant
    name: "Indoor Temperature"
    id: indoor_temp
    entity_id: !secret temperature_sensor_entity
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_value
          text: !lambda |-
            char buf[32];
            sprintf(buf, "%.1f°F", x);
            return buf;

  - platform: homeassistant
    name: "Indoor Humidity"
    id: indoor_humidity
    entity_id: !secret humidity_sensor_entity
    internal: true
    on_value:
      - lvgl.label.update:
          id: humidity_value
          text: !lambda |-
            char buf[32];
            sprintf(buf, "%.0f%%", x);
            return buf;

  # WiFi Signal Sensor
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address

# -------------------
# Buttons for Manual Control
# -------------------
button:
  - platform: restart
    name: "Restart Display"
