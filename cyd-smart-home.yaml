substitutions:
  device_name: "cyd-smart-home"
  friendly_name: "Smart Home Display"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  manual_ip:
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    static_ip: 192.168.1.222

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

# -------------------
# Display Configuration
# -------------------

# Fonts
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 14
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_medium
    size: 18
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_large
    size: 24
    bpp: 4

# SPI Configuration
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Display
display:
  - platform: ili9xxx
    model: ili9342
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    invert_colors: true
    id: my_display
    auto_clear_enabled: false

# Touchscreen
touchscreen:
  - platform: xpt2046
    id: my_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3850
      y_min: 240
      y_max: 3860

# -------------------
# LVGL Configuration
# -------------------
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch

  color_depth: 16
  bg_color: 0x000000

  pages:
    - id: main_page
      widgets:
        # Status bar at top
        - obj:
            x: 0
            y: 0
            width: 100%
            height: 30
            bg_color: 0x2196F3
            widgets:
              - label:
                  id: time_label
                  text: "--:--"
                  text_color: 0xFFFFFF
                  text_font: font_medium
                  align: CENTER

        # Temperature display
        - obj:
            x: 10
            y: 40
            width: 300
            height: 50
            bg_color: 0x333333
            border_color: 0x666666
            border_width: 2
            radius: 5
            widgets:
              - label:
                  text: "Temperature"
                  text_color: 0xCCCCCC
                  text_font: font_small
                  x: 10
                  y: 5
              - label:
                  id: temp_label
                  text: "--°F"
                  text_color: 0xFFFFFF
                  text_font: font_large
                  x: 10
                  y: 22

        # IP Address display
        - obj:
            x: 10
            y: 100
            width: 300
            height: 40
            bg_color: 0x333333
            border_color: 0x666666
            border_width: 2
            radius: 5
            widgets:
              - label:
                  id: ip_label
                  text: "IP: ---.---.---.---"
                  text_color: 0xFFFFFF
                  text_font: font_small
                  x: 10
                  y: 10

        # Fan control
        - obj:
            x: 10
            y: 150
            width: 145
            height: 70
            bg_color: 0x333333
            border_color: 0x666666
            border_width: 2
            radius: 5
            widgets:
              - label:
                  text: "Ceiling Fan"
                  text_color: 0xCCCCCC
                  text_font: font_small
                  x: 10
                  y: 5
              - label:
                  id: fan_status
                  text: "OFF"
                  text_color: 0xFF5252
                  text_font: font_medium
                  x: 10
                  y: 25
              - button:
                  id: fan_toggle_btn
                  x: 10
                  y: 45
                  width: 125
                  height: 20
                  clickable: true
                  on_click:
                    - homeassistant.service:
                        service: fan.toggle
                        data:
                          entity_id: fan.ifan_bedroom_001_fan
                  widgets:
                    - label:
                        text: "Toggle"
                        text_color: 0xFFFFFF
                        text_font: font_small
                        align: CENTER

        # Light control
        - obj:
            x: 165
            y: 150
            width: 145
            height: 70
            bg_color: 0x333333
            border_color: 0x666666
            border_width: 2
            radius: 5
            widgets:
              - label:
                  text: "Backlight"
                  text_color: 0xCCCCCC
                  text_font: font_small
                  x: 10
                  y: 5
              - label:
                  id: light_status
                  text: "OFF"
                  text_color: 0xFF5252
                  text_font: font_medium
                  x: 10
                  y: 25
              - button:
                  id: light_toggle_btn
                  x: 10
                  y: 45
                  width: 125
                  height: 20
                  clickable: true
                  on_click:
                    - light.toggle: backlight
                  widgets:
                    - label:
                        text: "Toggle"
                        text_color: 0xFFFFFF
                        text_font: font_small
                        align: CENTER

# -------------------
# RGB LED and Backlight
# -------------------
output:
  - platform: ledc
    pin: GPIO4
    id: output_red
  - platform: ledc
    pin: GPIO16
    id: output_green
  - platform: ledc
    pin: GPIO17
    id: output_blue
  - platform: ledc
    pin: GPIO21
    id: output_backlight
    frequency: 1000Hz

light:
  - platform: rgb
    name: "RGB LED"
    id: rgb_led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    output: output_backlight
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    on_turn_on:
      - lvgl.label.update:
          id: light_status
          text: "ON"
          text_color: 0x4CAF50
    on_turn_off:
      - lvgl.label.update:
          id: light_status
          text: "OFF"
          text_color: 0xFF5252

# -------------------
# Time Component
# -------------------
time:
  - platform: homeassistant
    id: homeassistant_time

# Update time every 10 seconds
interval:
  - interval: 10s
    then:
      - lvgl.label.update:
          id: time_label
          text:
            time_format: "%H:%M"
            time: homeassistant_time

# -------------------
# Sensors
# -------------------
binary_sensor:
  - platform: homeassistant
    name: "Fan State"
    id: fan_state
    entity_id: fan.ifan_bedroom_001_fan
    internal: true
    on_state:
      - lvgl.label.update:
          id: fan_status
          text: !lambda |-
            if (x) {
              return "ON";
            } else {
              return "OFF";
            }
          text_color: !lambda |-
            if (x) {
              return 0x4CAF50;
            } else {
              return 0xFF5252;
            }

sensor:
  - platform: homeassistant
    name: "HVAC Current Temperature"
    id: current_temp
    entity_id: climate.t6_pro_z_wave_thermostat
    attribute: current_temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_label
          text:
            format: "%.1f°F"
            args: [x]

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
      on_value:
        - lvgl.label.update:
            id: ip_label
            text: !lambda |-
              return ("IP: " + x).c_str();

# -------------------
# Buttons for HA
# -------------------
button:
  - platform: restart
    name: "Restart Display"
