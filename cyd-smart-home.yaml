substitutions:
  device_name: "cyd-smart-home-display"
  friendly_name: "Smart Home Display"

  # Home Assistant Entity IDs
  temperature_sensor: "sensor.your_temperature_sensor"
  humidity_sensor: "sensor.your_humidity_sensor"
  ceiling_fan: "fan.your_ceiling_fan"
  ceiling_fan_light: "light.your_ceiling_fan_light"

# Import common configurations
packages:
  common: !include templates/common.yaml
  device: !include templates/ESP32-2432S028R.yaml

esphome:
  on_boot:
    priority: 600
    then:
      - light.turn_off: rgb_led

# Update WiFi status every 10 seconds
interval:
  - interval: 10s
    then:
      - lvgl.label.update:
          id: wifi_status
          text: !lambda |-
            return std::string(id(wifi_component).is_connected() ? "WiFi: Connected" : "WiFi: Disconnected");
      - lvgl.label.update:
          id: wifi_status
          text_color: !lambda |-
            return id(wifi_component).is_connected() ? lv_color_hex(0x00FF00) : lv_color_hex(0xFF0000);

wifi:
  id: wifi_component
  manual_ip:
    static_ip: 192.168.1.222
    gateway: 192.168.1.1
    subnet: 255.255.255.1

# -------------------
# Display Configuration
# -------------------

# Define colors
color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_orange
    red: 100%
    green: 50%
    blue: 0%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%
  - id: light_gray
    red: 80%
    green: 80%
    blue: 80%

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
  - file: "gfonts://Roboto"
    id: roboto_32
    size: 32
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12

# LVGL Graphics
lvgl:
  log_level: INFO

  pages:
    - id: main_page
      widgets:
        # Header with time
        - obj:
            x: 0
            y: 0
            width: 320
            height: 30
            bg_color: 0x0066CC
            border_width: 0
            widgets:
              - label:
                  align: LEFT_MID
                  x: 10
                  text: "Home (1/2)"
                  text_font: roboto_16
                  text_color: 0xFFFFFF
              - label:
                  id: time_label
                  align: RIGHT_MID
                  x: -10
                  text: "00:00"
                  text_font: roboto_16
                  text_color: 0xFFFFFF

        # Temp & Humidity Info Row
        - label:
            x: 10
            y: 40
            text_font: roboto_12
            text_color: 0xFFFFFF
            id: temp_humidity_label
            text: "-- | --%"

        # Grid of control buttons (2x2)
        # Row 1, Col 1 - Fan Light
        - button:
            x: 10
            y: 60
            width: 145
            height: 70
            bg_color: 0x004488
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text: "\U0001F4A1"
                  text_font: roboto_24
                  text_color: 0xFFDD00
              - label:
                  id: fan_light_label
                  align: BOTTOM_MID
                  y: -8
                  text: "Fan Light"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: ${ceiling_fan_light}

        # Row 1, Col 2 - Ceiling Fan
        - button:
            x: 165
            y: 60
            width: 145
            height: 70
            bg_color: 0x004488
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text: "\U0001F4A8"
                  text_font: roboto_24
                  text_color: 0x00DDFF
              - label:
                  id: fan_status_label
                  align: BOTTOM_MID
                  y: -8
                  text: "Fan: OFF"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
            on_click:
              - homeassistant.service:
                  service: fan.toggle
                  data:
                    entity_id: ${ceiling_fan}

        # Row 2, Col 1 - Fan Speed
        - button:
            x: 10
            y: 140
            width: 145
            height: 70
            bg_color: 0x004488
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text: "+"
                  text_font: roboto_24
                  text_color: 0x00FF88
              - label:
                  align: BOTTOM_MID
                  y: -8
                  text: "Speed Up"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
            on_click:
              - homeassistant.service:
                  service: fan.increase_speed
                  data:
                    entity_id: ${ceiling_fan}

        # Row 2, Col 2 - RGB LED
        - button:
            x: 165
            y: 140
            width: 145
            height: 70
            bg_color: 0x004488
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text: "\U0001F308"
                  text_font: roboto_24
                  text_color: 0xFF00FF
              - label:
                  align: BOTTOM_MID
                  y: -8
                  text: "RGB LED"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
            on_click:
              - light.toggle: rgb_led

        # WiFi Status (bottom left)
        - label:
            id: wifi_status
            x: 10
            y: 220
            text: "WiFi"
            text_font: roboto_12
            text_color: 0x00FF00

# -------------------
# Time Component
# -------------------
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: /30
        then:
          - lvgl.label.update:
              id: time_label
              text: !lambda |-
                char buf[32];
                auto time = id(homeassistant_time).now();
                int hour = time.hour % 12;
                if (hour == 0) hour = 12;
                sprintf(buf, "%02d:%02d %s", hour, time.minute, time.hour >= 12 ? "PM" : "AM");
                return std::string(buf);

# -------------------
# Sensors from Home Assistant
# -------------------

# Import states from Home Assistant
binary_sensor:
  - platform: homeassistant
    name: "Fan State"
    id: fan_state
    entity_id: ${ceiling_fan}
    internal: true
    on_state:
      - lvgl.label.update:
          id: fan_status_label
          text: !lambda |-
            return std::string(x ? "Fan: ON" : "Fan: OFF");

sensor:
  - platform: homeassistant
    name: "Indoor Temperature"
    id: indoor_temp
    entity_id: ${temperature_sensor}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_humidity_label
          text: !lambda |-
            auto temp = x;
            auto hum = id(indoor_humidity).state;
            char buf[64];
            sprintf(buf, "%.1f°F | %.0f%%", temp, hum);
            return std::string(buf);

  - platform: homeassistant
    name: "Indoor Humidity"
    id: indoor_humidity
    entity_id: ${humidity_sensor}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_humidity_label
          text: !lambda |-
            auto temp = id(indoor_temp).state;
            auto hum = x;
            char buf[64];
            sprintf(buf, "%.1f°F | %.0f%%", temp, hum);
            return std::string(buf);

  # WiFi Signal Sensor
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address

# -------------------
# Buttons for Manual Control
# -------------------
button:
  - platform: restart
    name: "Restart Display"
