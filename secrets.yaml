# ESPHome Secrets Configuration
# Replace the placeholder values with your actual credentials and entity IDs

# API and OTA passwords
api_key: "YOUR_32_CHARACTER_API_KEY_HERE"
ota_password: "YOUR_OTA_PASSWORD_HERE"

# WiFi credentials
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Access Point password (for fallback hotspot)
ap_password: "YOUR_AP_PASSWORD"

# Home Assistant Entity IDs
# Replace these with your actual entity IDs from Home Assistant

# Ceiling Fan Entity
# Example: fan.ifan_bedroom_001_fan
# Note: This fan has 3-speed control (33%, 66%, 100%) with no direction support
ceiling_fan_entity: "fan.ifan_bedroom_001_fan"

# HVAC/Climate Entity
# T6 Pro Z-Wave Thermostat with modes: off, heat, cool
hvac_entity: "climate.t6_pro_z_wave_thermostat"

# Camera Entity
# Example: camera.front_door
camera_entity: "camera.your_camera"

# Optional: Script entities for "All On" and "All Off" buttons
# You'll need to create these scripts in Home Assistant
# Example scripts:
#   script.all_devices_on
#   script.all_devices_off
